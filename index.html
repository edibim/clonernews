<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ClonerNews</title>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <noscript>
      ClonerNews requires JavaScript to work.
    </noscript>

    <header>
      <h1>ClonerNews</h1>

      <nav aria-label="Post categories">
        <button type="button">Stories</button>
        <button type="button">Jobs</button>
        <button type="button">Polls</button>
      </nav>
    </header>

    <main id="app">
      <section
        id="live-updates"
        aria-live="polite"
        aria-label="Live updates"
      ></section>

      <section
        id="feed"
        aria-labelledby="feed-heading"
      >
        <h2 id="feed-heading">Stories</h2>

        <div id="feed-list"></div>

        <button id="load-more" type="button">
          Load more
        </button>

        <div
          id="feed-sentinel"
          aria-hidden="true"
        ></div>
      </section>
    </main>

    <dialog id="post-detail">
      <button
        id="close-detail"
        type="button"
        aria-label="Close post details"
      >
        Close
      </button>

      <div id="detail-content"></div>
    </dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
